<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Anti-FOUC: aplica tema antes do React montar
      (function () {
        try {
          var stored = localStorage.getItem('flowalt-theme');
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'light'
            ? stored
            : (sysDark ? 'dark' : 'light');
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flowalt" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon (FlowAlt Symbol) -->
    <link rel="icon" type="image/png" href="/flowalt-symbol.png" />
    <link rel="shortcut icon" type="image/png" href="/flowalt-symbol.png" />
    <link rel="apple-touch-icon" href="/flowalt-symbol.png" />

    <title>Flowalt — Fluxo de trabalho inteligente</title>
    <meta name="description" content="Organize o trabalho, não controle pessoas. Plataforma premium para times que executam com clareza, fluxo e resultado." />
    <meta name="author" content="Flowalt" />
    <meta name="keywords" content="flowalt, gestão de projetos, produtividade, workflow, kanban, times criativos, agências" />

    <!-- Open Graph -->
    <meta property="og:title" content="Flowalt — Fluxo de trabalho inteligente" />
    <meta property="og:description" content="Clareza, ação e progresso sem atrito. A plataforma premium para times que entregam." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowalt" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flowalt — Fluxo de trabalho inteligente" />
    <meta name="twitter:description" content="Clareza, ação e progresso sem atrito." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
