<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flowalt" />
    <link rel="manifest" href="/manifest.json" />
    
    <title>Flowalt - Gestão Jurídica</title>
    <meta name="description" content="Sistema completo de gestão para escritórios de advocacia. Organize processos, acompanhe prazos e gerencie sua equipe com eficiência." />
    <meta name="author" content="Flowalt" />
    <meta name="keywords" content="gestão jurídica, advocacia, processos, prazos, escritório de advocacia" />

    <!-- Open Graph -->
    <meta property="og:title" content="Flowalt - Gestão Jurídica Inteligente" />
    <meta property="og:description" content="Sistema completo de gestão para escritórios de advocacia" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:site_name" content="Flowalt" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flowalt - Gestão Jurídica" />
    <meta name="twitter:description" content="Sistema completo de gestão para escritórios de advocacia" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
